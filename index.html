<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A with HuggingFace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Question Answering Demo</h1>
    <form id="askForm">
      <textarea id="context" rows="8" placeholder="Type unseen paragraph here..."></textarea>
      <textarea id="question" rows="2" placeholder="Type related question here..."></textarea>
      <button type="submit">Ask</button>
    </form>
    
    <h2>Answer:</h2>
    <div id="answer"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
